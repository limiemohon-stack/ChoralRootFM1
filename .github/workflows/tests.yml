# SPDX-License-Identifier: GPL-3.0-only
# Run the pure-C host tests on every push and pull request (release.yml and pages.yml only trigger on a
# version tag or a published release, so without this, nothing built or tested a plain commit at all).
#
# Scope: this runs only the tests/run_cr_tests.sh entries that need nothing beyond a C compiler and Python 3
# -- cr_bootguard_test, cr_stub_test, stub_pkg_test.py, cr_engine_test, cr_loop_test, cr_harmony_test,
# cr_settings_test, cr_usbaudio_test, cr_usbaudio48_test, cr_usbrate_test, cr_midi_test (verified against a
# local run, one by one, before this file was written -- every other entry in run_cr_tests.sh, cr_backup_test
# and cr_restart_test and cr_fm6_test and cr_cz_test included, needs -Ibuild/gen too). It deliberately does
# NOT run those build/gen-dependent entries (generated by tools/build.py's Pillow + libraqm font
# rasterization), tests/run_all.sh's device build (Docker + the JieLi toolchain), or the native/browser
# emulator builds (macOS frameworks, Emscripten) -- see the Harmony Preview Edge Case Spec's CI-wiring
# section for why a full run_all.sh gate needs its own properly provisioned job rather than being bolted
# in here.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cr_bootguard_test
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic -O2 -o /tmp/cr_bootguard_test tests/cr_bootguard_test.c
          /tmp/cr_bootguard_test
      - name: cr_stub_test
        run: |
          clang -std=c99 -Wall -Wextra -Wno-unused-function -Werror -pedantic -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -o /tmp/cr_stub_test tests/cr_stub_test.c
          /tmp/cr_stub_test
      - name: stub_pkg_test.py
        run: python3 tests/stub_pkg_test.py
      - name: cr_engine_test
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic -O2 -o /tmp/cr_engine_test tests/cr_engine_test.c firmware/src/cr_engine.c
          /tmp/cr_engine_test
      - name: cr_loop_test
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic -O2 -o /tmp/cr_loop_test tests/cr_loop_test.c firmware/src/cr_loop.c firmware/src/cr_engine.c
          /tmp/cr_loop_test
      - name: cr_harmony_test
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic -O2 -o /tmp/cr_harmony_test tests/cr_harmony_test.c firmware/src/cr_harmony.c firmware/src/cr_engine.c
          /tmp/cr_harmony_test
      - name: cr_settings_test
        run: |
          clang -std=c11 -Wall -Wextra -Werror -pedantic -O2 -o /tmp/cr_settings_test tests/cr_settings_test.c firmware/src/cr_settings.c firmware/src/cr_engine.c
          /tmp/cr_settings_test
      - name: cr_usbaudio_test
        run: |
          clang -std=gnu11 -O2 -w -o /tmp/cr_usbaudio_test tests/cr_usbaudio_test.c
          /tmp/cr_usbaudio_test
      - name: cr_usbaudio48_test
        run: |
          clang -std=gnu11 -O2 -w -o /tmp/cr_usbaudio48_test tests/cr_usbaudio48_test.c -lm
          /tmp/cr_usbaudio48_test
      - name: cr_usbrate_test
        run: |
          clang -std=gnu11 -O2 -w -o /tmp/cr_usbrate_test tests/cr_usbrate_test.c
          /tmp/cr_usbrate_test
      - name: cr_midi_test
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic -O2 -o /tmp/cr_midi_test tests/cr_midi_test.c
          /tmp/cr_midi_test
